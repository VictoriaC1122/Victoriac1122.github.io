<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f4fe" />
    <title data-i18n="meta.activities.title">25-26 年度紀事｜活動</title>
    <meta
      name="description"
      content="收錄 2025.06 至 2026.06 的年度活動，包含日期、照片與活動紀錄。"
      data-i18n-attr="content:meta.activities.description"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-activities">
    <a class="skip-link" href="#top" data-i18n="common.skipLink">直接前往主要內容</a>
    <div class="page-aura page-aura-left" aria-hidden="true"></div>
    <div class="page-aura page-aura-right" aria-hidden="true"></div>
    <div class="page-gridline" aria-hidden="true"></div>

    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="index.html">
          <span class="brand-mark">25-26</span>
          <span class="brand-copy">
            <strong data-i18n="common.brand.title">年度紀事</strong>
            <span data-i18n="common.brand.subtitle">詠文・婉華</span>
          </span>
        </a>

        <div class="topbar-actions">
          <nav class="topbar-nav" aria-label="頁面導覽" data-i18n-attr="aria-label:common.nav.aria">
            <a href="index.html" data-i18n="common.nav.home">首頁</a>
            <a href="activities/" aria-current="page" data-i18n="common.nav.activities">活動頁</a>
            <a href="leaders/" data-i18n="common.nav.leaders">會長介紹</a>
            <a href="handbook/" data-i18n="common.nav.handbook">手冊</a>
          </nav>

          <button class="lang-toggle" type="button" data-language-toggle>
            <span class="lang-toggle-option" data-language-option="zh-TW" data-i18n="common.language.zhShort">
              繁中
            </span>
            <span class="lang-toggle-divider" aria-hidden="true">/</span>
            <span class="lang-toggle-option" data-language-option="en" data-i18n="common.language.enShort">
              EN
            </span>
          </button>
        </div>
      </header>

      <main id="top" class="page-main" tabindex="-1">
        <section class="archive-head" id="archive">
          <div class="archive-copy">
            <p class="eyebrow" data-i18n="activities.archive.eyebrow">年度時間軸</p>
            <h2 data-i18n="activities.archive.title">2025.06 — 2026.06 年度活動</h2>
            <p class="archive-intro" data-i18n="activities.archive.intro">
              從 2025.06 到 2026.06，活動沿著時間排開。名稱與日期以交接典禮手冊為準，11 月三場例會也各自收錄。
            </p>
          </div>

          <div class="archive-actions">
            <div class="filter-chips" id="filterChips" aria-label="年份篩選" data-i18n-attr="aria-label:activities.archive.filterAria"></div>
            <p class="filter-hint" data-i18n="activities.archive.filterHint">左右滑動可切換年份</p>
            <p class="archive-note" id="resultsNote"></p>
          </div>
        </section>

        <section class="event-grid" id="eventGrid" aria-live="polite"></section>
      </main>
    </div>

    <div class="detail-modal" id="detailModal" hidden>
      <div class="detail-backdrop" data-close-modal="true"></div>

      <section
        class="detail-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="detailTitle"
        aria-describedby="detailSummary"
      >
        <button
          class="detail-close"
          id="detailClose"
          aria-label="關閉詳情"
          data-i18n="common.detail.close"
          data-i18n-attr="aria-label:common.detail.closeAria"
        >
          關閉
        </button>

        <div class="detail-scroll">
          <div class="detail-hero" id="detailHero"></div>

          <div class="detail-body">
            <div class="detail-reading-layout">
              <div class="detail-meta">
                <p class="detail-kicker" id="detailKicker"></p>
                <h2 id="detailTitle"></h2>
                <p class="detail-summary" id="detailSummary"></p>
              </div>

              <aside
                class="detail-aside"
                aria-label="活動資訊與連結"
                data-i18n-attr="aria-label:common.detail.infoAria"
              >
                <div class="detail-info" id="detailInfo"></div>
                <div class="detail-tags" id="detailTags"></div>
                <div class="detail-links" id="detailLinks"></div>
              </aside>
            </div>

            <section class="detail-activities" id="detailActivities" hidden>
              <div class="detail-section-head">
                <p class="eyebrow" data-i18n="common.detail.activitiesEyebrow">本月活動</p>
                <h3 data-i18n="common.detail.activitiesTitle">本月活動</h3>
              </div>
              <div class="activity-block-grid" id="detailActivityBlocks"></div>
            </section>

            <section class="detail-gallery">
              <div class="detail-section-head">
                <p class="eyebrow" data-i18n="common.detail.photosEyebrow">活動照片</p>
                <h3 data-i18n="common.detail.photosTitle">照片一覽</h3>
              </div>
              <div class="gallery-grid" id="detailGallery"></div>
            </section>
          </div>
        </div>
      </section>
    </div>

    <script src="i18n-data.js"></script>
    <script src="i18n.js"></script>
    <script src="activity-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
